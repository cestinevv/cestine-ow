  <text x="800" y="146" fill="#94a3b8" font-size="10" text-anchor="middle">S3 / OSS</text>

  <rect x="965" y="105" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="965" y="105" width="150" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
