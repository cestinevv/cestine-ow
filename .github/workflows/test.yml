name: Web Onestory Test Deployment

on:
  push:
    branches:
      - test
  workflow_dispatch:
jobs:
  call-deployment-in-local-repo:
    uses: ./.github/workflows/deploy.yml
    with:
      APPLICATION_NAME: onestory-web
      DEPLOYMENT_ENV: test
      ECR_REPOSITORY: onestory-test
      ECS_CLUSTER: web
      SECURITY_GROUP_IDS_SSM: /dev/security-groups
      SUBNET_IDS_SSM: /dev/subnet-ids
      VPC_ID_SSM: /dev/vpc-id
      SNS_TO_LARK_LAMBDA_ARN: /staging/lambda/sns-to-lark
      CERERTIFICATE_US_EAST_2_ARN: /staging/certificate
      ECS_EXECUTION_ROLE_ARN: /staging/ecs-execution-role

    secrets:
      DEPLOYMENT_AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOYMENT_AWS_ACCESS_KEY_ID }}
      DEPLOYMENT_AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOYMENT_AWS_SECRET_ACCESS_KEY }}
      ED25519_CI_KEY: ${{ secrets.ED25519_CI_KEY }}
      PAT: ${{ secrets.PAT }}
