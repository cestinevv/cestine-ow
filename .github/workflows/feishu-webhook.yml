name: Feishu Push Notify

on:
  push:
    branches: [ "main", "master" ] # 监听 main 和 master 分支的提交

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"🚀 GitHub 代码提交通知\n仓库：${{ github.repository }}\n提交人：${{ github.actor }}\n提交信息：${{ github.event.head_commit.message }}\n提交时间：${{ github.event.head_commit.timestamp }}\n查看代码：${{ github.event.compare }}\"
              }
            }"