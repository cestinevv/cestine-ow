  <text x="32" y="64" fill="#94a3b8" font-size="12">/create · upload session → presign+PUT → POST /creator/dramas</text>
  <text x="32" y="84" fill="#64748b" font-size="11">draft = localStorage only · no edit / NFT mint</text>

  <!-- Participants CX: 110, 320, 560, 800, 1040 -->
  <rect x="40" y="105" width="140" height="52" rx="6" fill="#0f172a"/>
  <rect x="40" y="105" width="140" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="128" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">User</text>
  <text x="110" y="146" fill="#94a3b8" font-size="10" text-anchor="middle">browser</text>

  <rect x="245" y="105" width="150" height="52" rx="6" fill="#0f172a"/>
