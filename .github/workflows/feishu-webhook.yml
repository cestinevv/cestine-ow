name: Feishu Push Notify

on:
  push:
    branches: [ "main", "master" ] # 监听 main 和 master 分支的提交

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          COMPARE: ${{ github.event.compare }}
        run: |
          TEXT=$(printf "🚀 GitHub 代码提交通知\n仓库：${REPO}\n提交人：${ACTOR}\n提交信息：${COMMIT_MSG}\n提交时间：${TIMESTAMP}\n查看代码：${COMPARE}")
          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$TEXT" '{"msg_type":"text","content":{"text":$text}}')"