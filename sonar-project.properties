# SonarQube project configuration.
#
# Only used when repo Variable ENABLE_SONAR="true" — see .github/workflows/pr-analysis.yml.
#
# Required repo Secrets when ENABLE_SONAR=true:
#   SONAR_HOST_URL   — e.g. https://sonar.internal.company.com
#   SONAR_TOKEN      — user or project analysis token
# Optional repo Variables:
#   SONAR_PROJECT_KEY — defaults to "web-onestory"
#
# To scan locally against your Sonar instance:
#   SONAR_HOST_URL=... SONAR_TOKEN=... npx sonar-scanner

sonar.projectKey=web-onestory
sonar.projectName=Web OneStory
sonar.projectVersion=1.0

# Sources
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions — auto-generated code, third-party, build artifacts
sonar.exclusions=\
  src/api/__generated__/**,\
  src/solana/**,\
  src/routeTree.gen.ts,\
  **/*.stories.tsx,\
  **/*.stories.ts,\
  scripts/**,\
  public/**,\
  demo/**,\
  aws/**,\
  docs/**,\
  dist/**,\
  .output/**,\
  node_modules/**

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage — wire this up when tests exist:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication threshold (Sonar default is fine for this project)
# sonar.cpd.exclusions=

# Quality gate wait — block PR merge on gate failure
sonar.qualitygate.wait=true
