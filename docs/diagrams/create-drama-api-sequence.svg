  <text x="560" y="146" fill="#94a3b8" font-size="10" text-anchor="middle">/api/mini-drama</text>

  <rect x="725" y="105" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="725" y="105" width="150" height="52" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
